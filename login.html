<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="robots" content="noindex, nofollow">

    <title>Melanin Accessories - Admin Login</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

    <main class="login-container">

        <div class="login-box">

            <img
                class="login-box__logo"
                src="logo.png"
                alt="Melanin Accessories"
            >

            <h1>Melanin Accessories</h1>

            <h2>Admin Login</h2>

            <p>
                Authorized personnel only.
            </p>


            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <div class="field-icon">

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="username"
                        autocapitalize="off"
                        spellcheck="false"
                        autofocus
                        required
                    >

                </div>


                <label for="password">
                    Password
                </label>

                <div class="field-icon">

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button type="submit">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
                    Login
                </button>

                <p
                    id="loginMessage"
                    role="alert"
                    aria-live="polite"
                ></p>

            </form>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="admin.js"></script>

</body>

</html>
